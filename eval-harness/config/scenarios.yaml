# Eval scenarios: dataset × query. The harness runs on jungle_market only:
# moon_market and yummy_food are kept out of it as test sets, so prompts and
# thresholds are never tuned against them.
#
# `upload` lists the local files run_eval.py puts in S3 (where the web app puts
# uploads) for the runtime to read; the answer sheet next to the CSV is never
# listed, so it can't reach the agents. `csv` and `answer_key` are local paths
# used by the graders (relative to eval-harness/).
#
# hitl:          → feedback sent at each plan review, in order. Empty or
#                  exhausted list = approve.
# requirements:  → what the request asks for, one checkable item each. The LLM
#                  judge marks each met / partial / missing (judge.py); a
#                  missing one fails core_pass when the judge has run.
# pass:          → thresholds for core_pass (defaults in grade.py DEFAULT_PASS):
#                  required_facts    answer-key ids the fact check (factcheck.py) must find stated correctly
#                  min_other_facts   of the remaining answer-key facts, how many must
#                  min_recompute     calculations that must be re-derived from the CSV
#                  min_cited_checked "number [n]" pairs that must be compared
#                  Set from real runs: half of the lowest count in a normal run.

scenarios:
  # Main benchmark: open growth request. The data has planted patterns a
  # shallow analysis gets wrong (duplicate rows, Simpson's paradox, a stockout,
  # threshold bunching, a promotion halo); see ground_truth.md.
  jungle_market:
    upload: &jungle_files
      - ../deep-insight-web/sample_data/jungle-market/jungle-market-sales.csv
      - ../deep-insight-web/sample_data/jungle-market/column_definitions.json
    csv: ../deep-insight-web/sample_data/jungle-market/jungle-market-sales.csv
    answer_key: answer_keys/jungle_market.json
    query: |
      jungle-market-sales.csv 는 분석 파일이고, column_definitions.json은 컬럼에 대한 설명입니다.
      데이터에서 비즈니스 성장 기회를 발굴해줘:
      숨겨진 고객 패턴과 세그먼트를 발견하고, 수익 최적화 방안을 제시하며,
      마케팅과 운영 효율성을 높일 수 있는 개선점을 찾고,
      다음 달 매출을 크게 늘릴 수 있는 실행 가능한 전략 3가지를 우선순위와 기대 효과를 포함해서 제안해줘.
      결과는 DOCX로 저장해줘.
    hitl: []
    requirements:
      - id: segments
        text: 데이터에서 찾은 고객 패턴이나 세그먼트를 수치 근거와 함께 제시한다
      - id: revenue_optimization
        text: 수익(매출·객단가·마진) 최적화 방안을 제시한다
      - id: marketing_ops
        text: 마케팅 또는 운영 효율성 개선점을 제시한다
      - id: three_strategies
        text: 다음 달 매출을 늘릴 실행 가능한 전략을 3가지 제시한다
      - id: priority
        text: 각 전략에 우선순위와 그 이유가 있다
      - id: expected_effect
        text: 각 전략에 기대 효과가 있고, 가능하면 수치와 산출 근거가 있다
    pass:
      # not calibrated on real runs yet: re-set from the first baseline runs
      required_facts: [total_revenue]
      min_other_facts: 0
      min_recompute: 10
      min_cited_checked: 5

  # Cheaper run for smoke-testing the harness itself.
  jungle_market_simple:
    upload: *jungle_files
    csv: ../deep-insight-web/sample_data/jungle-market/jungle-market-sales.csv
    answer_key: answer_keys/jungle_market.json
    query: |
      jungle-market-sales.csv 는 분석 파일이고, column_definitions.json은 컬럼에 대한 설명입니다.
      총 매출액, 주문 건수, 평균 주문 금액을 계산하고 카테고리별 매출 비중도 함께 보여줘. 결과물을 DOCX로 만들어줘.
    hitl: []
    requirements:
      - id: total_revenue
        text: 총 매출액을 제시한다
      - id: order_count
        text: 주문 건수를 제시한다
      - id: aov
        text: 평균 주문 금액을 제시한다
      - id: category_share
        text: 카테고리별 매출 비중을 제시한다
    pass: &simple_pass
      # the request names these three numbers, so all are required
      required_facts: [total_revenue, order_count, avg_order_value]
      min_other_facts: 0
      min_recompute: 4
      min_cited_checked: 5

  # Exercises the plan-revision path (planner_revise) once before approving.
  jungle_market_revision:
    upload: *jungle_files
    csv: ../deep-insight-web/sample_data/jungle-market/jungle-market-sales.csv
    answer_key: answer_keys/jungle_market.json
    query: |
      jungle-market-sales.csv 는 분석 파일이고, column_definitions.json은 컬럼에 대한 설명입니다.
      총 매출액, 주문 건수, 평균 주문 금액을 계산하고 카테고리별 매출 비중도 함께 보여줘. 결과물을 DOCX로 만들어줘.
    hitl:
      - "도시별 매출 분석도 계획에 추가해줘."
    requirements:
      - id: total_revenue
        text: 총 매출액을 제시한다
      - id: order_count
        text: 주문 건수를 제시한다
      - id: aov
        text: 평균 주문 금액을 제시한다
      - id: category_share
        text: 카테고리별 매출 비중을 제시한다
      - id: city_revenue
        text: 계획 검토에서 추가 요청한 도시별 매출 분석이 포함되어 있다
    pass: *simple_pass

  # The growth request in English (the data is English).
  jungle_market_en:
    upload: *jungle_files
    csv: ../deep-insight-web/sample_data/jungle-market/jungle-market-sales.csv
    answer_key: answer_keys/jungle_market.json
    query: |
      jungle-market-sales.csv is the data file and column_definitions.json describes the columns.
      Find business growth opportunities in the data: discover hidden customer patterns and segments,
      propose revenue optimization, find improvements for marketing and operational efficiency,
      and propose 3 actionable strategies to significantly grow next month's revenue, with priority and expected impact.
      Save the result as DOCX.
    hitl: []
    requirements:
      - id: segments
        text: Presents customer patterns or segments found in the data, with numbers
      - id: revenue_optimization
        text: Proposes ways to optimize revenue (sales, order value, margin)
      - id: marketing_ops
        text: Identifies marketing or operational efficiency improvements
      - id: three_strategies
        text: Proposes 3 actionable strategies to grow next month's revenue
      - id: priority
        text: Each strategy has a priority and a reason for it
      - id: expected_effect
        text: Each strategy has an expected impact, quantified with its basis where possible
    pass:
      # not calibrated on real runs yet: re-set from the first baseline runs
      required_facts: [total_revenue]
      min_other_facts: 0
      min_recompute: 10
      min_cited_checked: 5
