# USD per 1M tokens. Matched against the model ID by substring, first match
# wins, so list more specific families first.
#
# verified: true  → Bedrock us-west-2, global cross-region inference, on-demand,
#                   from the AWS Pricing API (service AmazonBedrockFoundationModels,
#                   usagetype *_global_standard), checked 2026-10-02.
# verified: false → list price from public/Anthropic sources, not checked
#                   against Bedrock. Leave a price null if unknown: the token
#                   count is then reported as unpriced instead of guessed.
#
# cache_write is the 5-minute-TTL write price.

models:
  - match: claude-opus-5-5
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
    verified: true
  - match: claude-sonnet-5-5
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
    verified: true
  - match: claude-opus-5
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write: 6.25
    verified: true
  - match: claude-sonnet-5
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
    verified: true
  # LLM judge models (judge.yaml). Long-context requests are billed higher
  # (Astra: $20 / $75); reports are far below that threshold today.
  - match: openai.gpt-6-astra
    input: 10.00
    output: 50.00
    cache_read: 1.00
    cache_write: 12.50
    verified: true
  - match: openai.gpt-6.1-sol
    input: null
    output: null
    cache_read: null
    cache_write: null
    verified: false
  - match: openai.gpt-6-sol
    input: null
    output: null
    cache_read: null
    cache_write: null
    verified: false
  - match: claude-sonnet-4-5
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write: 3.75
    verified: false
  - match: claude-sonnet-4-2
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write: 3.75
    verified: false
  - match: claude-haiku-4-5
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write: 1.25
    verified: false
