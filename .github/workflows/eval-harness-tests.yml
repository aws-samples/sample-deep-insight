name: Eval harness tests

on:
  pull_request:
    paths:
      - eval-harness/**
      - managed-agentcore/src/**
      - .github/workflows/eval-harness*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eval-harness/requirements.txt
      - run: python -m pip install -r eval-harness/requirements.txt
      - name: Validate workflows
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/eval-harness.yml .github/workflows/eval-harness-tests.yml
      - name: Test graders and workflow orchestration without AWS calls
        working-directory: eval-harness
        run: python -m pytest -q --junitxml=/tmp/eval-harness-tests.xml
