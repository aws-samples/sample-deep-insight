name: Eval harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/eval-harness.yml
      - eval-harness/graders/**
      - eval-harness/invoke_runtime.py
      - eval-harness/runtime.py
      - eval-harness/Dockerfile

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Sequential evaluators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: eval-harness
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      EVAL_RUNTIME_ARN: ${{ vars.EVAL_RUNTIME_ARN }}
    defaults:
      run:
        working-directory: eval-harness
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install invocation client
        run: python -m pip install boto3==1.43.108
      - uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          role-to-assume: ${{ vars.EVAL_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eval-${{ github.run_id }}
      - name: Invoke Runtime once to run all evaluators sequentially
        run: python invoke_runtime.py --out results/evaluators.json
      - name: Upload runtime execution result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-runtime-results
          path: eval-harness/results/evaluators.json
          if-no-files-found: error
